<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Product</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <!--JavaScript -->
    <script defer src="assets/js/app.js"></script>

    <!--CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <div id="grid" class="container my-5">
        <!-- Grid 1 -->
        <h1 class="text-center text-primary">Shopping Cart</h1>

        <!-- Grid 2 -->
        <div id="formContainer" class="card p-4 shadow-sm">
            <form onsubmit="addProduct(event)" id="productForm">
                <div class="mb-3">
                    <label for="productName" class="form-label">Product Name</label>
                    <input type="text" id="productName" class="form-control" required placeholder="Enter product name">
                </div>

                <div class="mb-3">
                    <label for="productPrice" class="form-label">Product Price</label>
                    <input type="number" id="productPrice" class="form-control" required
                        placeholder="Enter product price">
                </div>

                <div class="mb-3">
                    <label for="productType" class="form-label">Choose Product Type</label>
                    <select id="productType" class="form-select" required>
                        <option value="drinks">Drinks</option>
                        <option value="meat">Meat</option>
                        <option value="dairy">Dairy</option>
                        <option value="snacks">Snacks</option>
                        <option value="basic">Basic</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="productLink" class="form-label">Product Image Link</label>
                    <input type="text" id="productLink" class="form-control" placeholder="Enter product image link">
                </div>

                <button type="submit" id="addProduct" class="btn btn-primary w-100">Add Product</button>
            </form>
        </div>

        <!-- Grid 3 -->
        <h2 class="text-center mt-4">Shopping Cart</h2>

        <!-- Grid 4 -->
        <table id="cartTable" class="table table-striped table-bordered mt-4 shadow-sm">
            <thead class="table-primary">
                <tr>
                    <th>Product Name</th>
                    <th>Product Price</th>
                    <th>Category</th>
                    <th>Image</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="productsTable">
                <!-- Products will be added here dynamically -->
            </tbody>
        </table>
    </div>
</body>

</html>
