<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Product</title>

    <!-- Links for the bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <!-- A script for the JavaScript -->
    <script defer src="/assets/js/app.js"></script>

    <!--A link for the CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <div id="grid">
        <header>Shopping cart</header>
        <div id="formContainer">
            <form id="productForm" onsubmit="addProduct(event)">
                <input type="text" id="productName" required placeholder="Enter product name">
                <br>
                <input type="number" id="productPrice" required placeholder="Enter product price">
                <br>

                <label for="productType">Choose product type:</label>
                <br>
                <select id="productType" required>
                    <option value="drinks">Drinks</option>
                    <option value="meat">Meat</option>
                    <option value="dairy">Dairy</option>
                    <option value="snacks">Snacks</option>
                    <option value="basic">Basic</option>
                </select>
                <br>
                <input type="text" id="productLink" placeholder="Product image link">
                <br>

                <button type="submit" id="add">Add product</button>
                <br><br>
            </form>
        </div>

        <h2>Shopping Cart</h2>
        <table id="cartTab`le">
            <thead>
                <tr>
                    <th>Product Name</th>
                    <th>Product Price</th>
                    <th>Category</th>
                    <th>Image</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="productsTable">
                <!-- Products will be added here dynamically -->
            </tbody>
        </table>
    </div>
</body>

</html>
